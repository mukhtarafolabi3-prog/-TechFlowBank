
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deposit | TechFlow Dynamic Bank</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="../css/deposit.css">
</head>

<body>

<div class="app">

    <main class="main" style="width:100%; margin-left:0;">

        <section class="content">

            <div class="panel">

                <div class="panel-heading">

                    <div>
                        <span>TRANSACTIONS</span>

                        <h3>
                            Deposit Money
                        </h3>
                    </div>

                </div>


                <form id="depositForm">

                    <div style="margin-bottom:16px;">

                        <label for="amount">
                            Deposit Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            min="100"
                            step="0.01"
                            placeholder="Enter amount"
                            required
                            style="
                                width:100%;
                                padding:12px;
                                margin-top:7px;
                                border:1px solid #e2e8f0;
                                border-radius:10px;
                            "
                        >

                    </div>


                    <div style="margin-bottom:16px;">

                        <label for="description">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            name="description"
                            placeholder="e.g. Cash deposit"
                            style="
                                width:100%;
                                padding:12px;
                                margin-top:7px;
                                border:1px solid #e2e8f0;
                                border-radius:10px;
                            "
                        >

                    </div>


                    <div style="margin-bottom:20px;">

                        <p>
                            Account Number
                        </p>

                        <strong id="accountNumber">
                            Loading...
                        </strong>

                    </div>


                    <div
                        id="depositMessage"
                        style="
                            margin-bottom:15px;
                            display:none;
                        "
                    ></div>


                    <button
                        type="submit"
                        class="next-btn"
                        id="depositBtn"
                    >
                        Deposit Money
                    </button>

                </form>

            </div>

        </section>

    </main>

</div>


<script src="../js/deposit.js"></script>

</body>

</html>
